name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # This is a *private* build container (YggdrasziI/ts2-castaway-decomp-build):
    # it holds the ROM in /extract, the ARM7 BIOS and the mwccarm compilers.
    container: ghcr.io/yggdraszii/ts2-castaway-decomp-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [eur]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy the ROM to the workspace (dsd extracts it during the build) and the
      # ARM7 BIOS to the root, so the original ROM SHA-1 is checked
      - name: Prepare
        run: |
          cp -a /extract/. ./extract/
          cp /arm7_bios.bin .

      # Tool versions must match tools/configure.py
      - name: Download tools
        run: |
          python tools/download_tool.py dsd v0.12.1 --path dsd
          python tools/download_tool.py objdiff v3.8.1 --path objdiff-cli
          python tools/download_tool.py wibo 1.2.0 --path wibo

      # Delink, link, check modules and symbols, rebuild and check the ROM, report
      - name: Build
        run: |
          ./dsd --version
          python tools/configure.py --version ${{ matrix.version }} -w ./wibo --compiler /mwccarm
          ninja

      # Draw the progress badges (nothing is committed by CI)
      - name: Progress badges
        run: python tools/progress_badges.py --version ${{ matrix.version }} --report build/${{ matrix.version }}/report.json --out build/${{ matrix.version }}/progress_badges

      - name: Upload progress badges
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_progress
          path: build/${{ matrix.version }}/progress_badges

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
